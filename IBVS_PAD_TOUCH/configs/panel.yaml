# STULZ 面板比例尺模型。原点：正面左上角，X 向右，Y 向下，Z 指向相机。
# 带 tape 的是现场尺量；带 estimated 的是按照片比例补的，不影响 Button 1/2/3 戳点。

panel_id: stulz_c7000_ioc
width_m: 0.300
height_m: 0.130
origin: top_left
units: meter

measurements:
  width_m: 0.300
  height_m: 0.130
  pair_from_right_right_m: 0.035   # 右上组合键右缘距面板右边
  pair_from_right_left_m: 0.070    # 右上组合键左缘距面板右边
  pair_from_top_m: 0.030           # Button 1/2 中心距上边（按尺量“距上边 3cm”）
  pair_to_button3_m: 0.020         # Button 1/2 中心到 Button 3 中心
  button_height_m: 0.006           # estimated：黄条高度，照片约 6mm
  notes:
    - Button 1 / 2 是同一颗大键左右对半，中间有一道较深的暗色分隔槽。
    - Button 3 是正下方 OK，宽度与组合键相同。
    - RESET / POWER / LED / LCD 仅供预览，第一阶段不戳。

display:
  origin_m: [0.035, 0.028]
  size_m: [0.175, 0.072]
  source: estimated

buttons:
  button_1:
    id: 1
    label: "<"
    aliases: ["Button 1", "B1", "SELECT_LEFT", "左"]
    color: yellow
    poke: true
    source: tape
    # 组合键左半：x ∈ [0.230, 0.2475]
    center_m: [0.23875, 0.030]
    size_m: [0.0175, 0.006]

  button_2:
    id: 2
    label: ">"
    aliases: ["Button 2", "B2", "SELECT_RIGHT", "右"]
    color: yellow
    poke: true
    source: tape
    # 组合键右半：x ∈ [0.2475, 0.265]
    center_m: [0.25625, 0.030]
    size_m: [0.0175, 0.006]

  button_3:
    id: 3
    label: "OK"
    aliases: ["Button 3", "B3", "OK", "确认"]
    color: yellow
    poke: true
    source: tape
    # 与组合键同宽，中心在其正下方 2cm
    center_m: [0.2475, 0.050]
    size_m: [0.035, 0.006]

references:
  reset:
    label: RESET
    color: yellow
    poke: false
    source: estimated
    center_m: [0.2475, 0.080]
    size_m: [0.035, 0.006]
  power:
    label: POWER
    color: red
    poke: false
    source: estimated
    center_m: [0.2475, 0.100]
    size_m: [0.030, 0.007]
  led_alarm:
    label: alarm
    color: red
    kind: led
    poke: false
    source: estimated
    center_m: [0.278, 0.080]
    size_m: [0.004, 0.004]
  led_power:
    label: power_led
    color: green
    kind: led
    poke: false
    source: estimated
    center_m: [0.278, 0.100]
    size_m: [0.004, 0.004]
