# 胸视图像伺服左右/上下。左边相机的侧视像素间隙伺服胸视前后。
# 接触后停止。不用右腕手眼，也不用 FK 三维位置当目标。

control_hz: 20
lambda_xyz: 0.35
max_delta_m: 0.006
# 胸口面板深度和侧视到夹爪的距离会替换这个值。深度丢了或超出范围时退回这里。
image_servo_nominal_depth_m: 0.60
min_depth_m: 0.08
max_depth_m: 1.20

# 指尖与按钮重合的门限。左右/上下先进这个门，才允许走深度。
align_xy_tol_norm: 0.006
contact_z_tol_m: 0.008
pixel_tol: 8
stable_frames: 5
side_contact_px: 14
# 胸视左右上下还没对准时，侧视间隙小于这个值就先后退，不要顶在墙上。
side_standoff_px: 36
side_approach_step_m: 0.004

# 面板是规则矩形时按钮用比例尺。否则姿态点需不低于该置信度且落在面板内。
yolo_point_conf: 0.3
